<!DOCTYPE html>
<html lang="ru" data-glass="on" data-density="cozy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>lab-hover-reveal — страница чемпиона (SEO)</title>
<link rel="preconnect" href="https://ddragon.leagueoflegends.com">
<link rel="stylesheet" href="../canon-tokens.css?v=1">
<link rel="stylesheet" href="hover-reveal-lab.css?v=39">
</head>
<body>
  <div class="splash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ДЕВ-ПОЛОСА (для НАС): тёмный солид, плавающая, драг, оверлей, сворачивается. -->
  <div class="lab-strip" id="labStrip">
    <div class="strip-head" id="stripHead">
      <span class="strip-title">⋮⋮ Дизайн-полоса</span>
      <button class="strip-reset" id="stripReset" type="button">↺ Сброс</button>
      <button class="strip-min-btn" id="stripMin" type="button">Свернуть</button>
    </div>
    <div class="strip-body" id="stripBody"></div>
  </div>

  <main class="lab-main">
    <div id="hrStage" class="hr-stage"></div>
  </main>

  <div id="hrOverlay" class="hr-overlay" hidden></div>

  <button class="gear-btn glass" id="gearBtn" type="button" title="Настройки">⚙</button>
  <div class="settings-pop glass thin-scroll" id="settingsPop" hidden></div>

  <script src="../lab-morph.js?v=2"></script>
  <script src="hover-reveal-abilities.js?v=1"></script>
  <script src="hover-reveal-lab.js?v=39"></script>
</body>
</html>

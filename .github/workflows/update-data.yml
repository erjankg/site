name: Update Wild Rift data

# Каждый день тянет свежую стату:
#  • fetch-wr-stats.mjs  — WR/PR/BR/тир всех чемпионов (источник Tencent CN: mlol.qt.qq.com)
#  • fetch-all.mjs       — гайды по всем чемпионам: матчапы/предметы/руны/заклинания/прокачка
# и коммитит обновлённые JSON в data-pipeline/. Данные публичные, секреты не нужны.
# Запускается по расписанию и вручную (кнопкой Run workflow).
#
# ⚠️ МАТЧАПЫ здесь НЕ пересобираются. Гайды тут обновляются ради сборок/рун, а сшивка
# матчапов (counters.json → matchups/) живёт в отдельном .github/workflows/update-matchups.yml
# и ходит РАЗ В НЕДЕЛЮ: скрейп чужих сайтов долгий, а сами матчапы меняются примерно раз в патч.
# Из-за этого matchups/ может на несколько дней отставать от guides/ — это нормально и ожидаемо.

on:
  schedule:
    - cron: '23 3 * * *'   # каждый день 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch champion win rates (Tencent)
        run: node data-pipeline/fetch-wr-stats.mjs

      - name: Fetch champion base stats (Tencent + Data Dragon)
        run: node data-pipeline/fetch-base-stats.mjs

      - name: Fetch all champion guides (matchups/items/runes)
        run: node data-pipeline/fetch-all.mjs

      # УМЕНИЯ. Без этого шага новый чемпион приезжает в статистику, но остаётся
      # без механик — значит его нет ни в тегах, ни в матчапах, ни у ИИ-коуча.
      # Так молча отстали Юнара и Чо'Гат: умения не качались с 19 июня.
      - name: Fetch champion abilities (Tencent)
        run: node data-pipeline/fetch-abilities.mjs

      - name: Fetch champion qualities (damage/survive/utility)
        run: node data-pipeline/fetch-champion-qualities.mjs

      # Пересборка производных: формулы умений → теги механик (нужны ИИ-коучу драфта).
      - name: Rebuild calc data + mechanic tags
        run: |
          node data-pipeline/build-calc-data.mjs
          node data-pipeline/build-champion-tags.mjs

      # СТОРОЖ ПАТЧА. Вышел новый патч → код 1 и чек-лист таймингов, которые робот
      # скачать не может (их Riot нигде не публикует). Задачу не валим: это сигнал.
      - name: Patch sentinel
        id: patch
        continue-on-error: true
        run: node data-pipeline/check-patch.mjs

      - name: Предупредить о новом патче
        if: steps.patch.outcome != 'success'
        run: echo "::warning::Вышел новый патч — тайминги карты помечены «требуют сверки». Смотри лог шага «Patch sentinel»."

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/wr-stats.json data-pipeline/base-stats.json data-pipeline/guides \
                  data-pipeline/abilities.json data-pipeline/champion-qualities.json \
                  data-pipeline/champion-abilities.json data-pipeline/champion-tags.json \
                  data-pipeline/patch-watch.json data-pipeline/jungle-economy.json
          if git diff --cached --quiet; then
            echo "Нет изменений в данных."
          else
            git commit -m "chore(data): daily Wild Rift stats refresh [skip ci]"
            git push
          fi

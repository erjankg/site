<!DOCTYPE html>
<html lang="ru" data-glass="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Калькулятор урона — Wild Rift</title>
<link rel="preconnect" href="https://ddragon.leagueoflegends.com">
<link rel="preconnect" href="https://www.wildriftfire.com">
<!-- ★ Канон + глобальные настройки — ТЕ ЖЕ файлы, что у боевого. Отдельной страницей
     калькулятор получает ту же подложку (--splash-img), что и сайт: ключ localStorage
     общий, значит арт совпадает без всякой синхронизации. Свой фон не заводим. -->
<link rel="stylesheet" href="../canon-tokens.css?v=2">
<link rel="stylesheet" href="calc-main.css?v=10">
<script src="../wr-prefs.js?v=2"></script>
<script>/* embed-режим (айфрейм на боевом ?embed=1): дев-полосы нет ДО рендера — без мигания */
  if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
  /* ⚙ сменили в родителе (или в другой вкладке) → подхватить. CSS-переменные границу
     iframe не переходят, а событие storage — переходит. */
  if(window.WRPrefs) WRPrefs.listenCrossDoc();</script>
</head>
<body>
  <!-- Экран строится в JS одним проходом: разметки-заглушки тут нет,
       чтобы первый кадр был сразу правильным (feedback_no_flash). -->
  <script src="../lab-settings.js"></script><!-- общий пульт лабов: автосохранение + 📋 Код/📥 Вставить + пресеты -->
  <script src="wr-data.js?v=3"></script>
  <script src="calc-engine.js?v=2"></script>
  <script src="calc-data.js?v=1"></script>
  <script src="calc-main.js?v=13"></script>
</body>
</html>
